<%+header%>

<style>
    /* OpenWrt Bootstrap Dark Theme - Matches other pages */
    .taixintools-container {
        max-width: 100%;
        padding: 0;
    }

    .signal-canvas {
        width: 100%;
        height: 400px;
        background: #1a1a1a;
        border: 1px solid #3a3a3a;
        border-radius: 3px;
    }

    .signal-canvas.active {
        border-color: #5cb85c;
        box-shadow: 0 0 5px rgba(92, 184, 92, 0.3);
    }

    .signal-stats {
        display: flex;
        gap: 20px;
        margin-top: 15px;
        padding: 15px;
        background: #2d2d2d;
        border: 1px solid #3a3a3a;
        border-radius: 3px;
    }

    .signal-stat-item {
        flex: 1;
        text-align: center;
    }

    .signal-stat-label {
        font-size: 11px;
        color: #999;
        margin-bottom: 5px;
    }

    .signal-stat-value {
        font-size: 24px;
        font-weight: bold;
        color: #e0e0e0;
    }

    .signal-stat-value.good {
        color: #5cb85c;
    }

    .signal-stat-value.fair {
        color: #f0ad4e;
    }

    .signal-stat-value.poor {
        color: #d9534f;
    }

    .device-item {
        padding: 8px 12px;
        margin: 4px 0;
        background: #2d2d2d;
        border: 1px solid #3a3a3a;
        border-radius: 3px;
        cursor: pointer;
        transition: all 0.2s;
        color: #e0e0e0;
    }

    .device-item:hover {
        background: #3a3a3a;
        border-color: #4a4a4a;
    }

    .device-item.selected {
        background: #337ab7;
        border-color: #2e6da4;
        color: white;
        font-weight: bold;
    }

    .device-list-container {
        max-height: 150px;
        overflow-y: auto;
        border: 1px solid #3a3a3a;
        border-radius: 3px;
        padding: 8px;
        background: #2d2d2d;
    }

    .no-devices {
        color: #999;
        font-style: italic;
        text-align: center;
        padding: 20px;
    }

    .status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 3px;
        font-size: 11px;
        font-weight: bold;
        margin-left: 8px;
    }

    .status-success {
        background: #5cb85c;
        color: white;
    }

    .status-warning {
        background: #f0ad4e;
        color: white;
    }

    .status-danger {
        background: #d9534f;
        color: white;
    }

    .alert-warning-custom {
        background: #fcf8e3;
        border: 1px solid #f0ad4e;
        color: #8a6d3b;
        padding: 10px;
        border-radius: 3px;
        margin-bottom: 15px;
    }

    .panel-title-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        flex-wrap: wrap;
        gap: 10px;
    }

    /* Consistent button sizing */
    .cbi-button {
        min-width: 120px;
        height: 32px;
        padding: 6px 12px;
        line-height: normal;
        display: inline-block;
    }
</style>

<div class="taixintools-container">
    <div class="cbi-map">
        <h2>Signal Monitor</h2>

        <!-- Interface Selection -->
        <fieldset class="cbi-section">
            <legend>Network Interface</legend>
            <div class="cbi-section-node">
                <div class="cbi-value">
                    <label class="cbi-value-title">Interface</label>
                    <div class="cbi-value-field">
                        <select id="interface-select" class="cbi-input-select">
                            <option value="">Loading...</option>
                        </select>
                        <span id="interface-status" class="status-badge"></span>
                    </div>
                </div>
            </div>
        </fieldset>

        <!-- Device Selection -->
        <fieldset class="cbi-section">
            <legend>Device Selection</legend>
            <div class="cbi-section-node">
                <div id="device-warning" class="alert-warning-custom">
                    <strong>⚠ Required:</strong> Scan and select a device to start monitoring
                </div>

                <div class="cbi-value">
                    <div class="cbi-value-field">
                        <button class="btn cbi-button cbi-button-action" id="scan-btn" onclick="scanDevices()">Scan for Devices</button>
                        <span id="scan-status"></span>
                    </div>
                </div>

                <div class="cbi-value">
                    <div class="cbi-value-field">
                        <div id="device-list" class="device-list-container">
                            <div class="no-devices">Click "Scan for Devices" to find NetAT devices</div>
                        </div>
                    </div>
                </div>
            </div>
        </fieldset>

        <!-- Signal Monitor -->
        <fieldset class="cbi-section">
            <legend>Live Signal Monitor</legend>
            <div class="cbi-section-node">
                <div class="panel-title-bar">
                    <div>
                        <button class="btn cbi-button cbi-button-positive" id="start-monitor-btn" onclick="startMonitoring()" disabled>Start Monitoring</button>
                        <button class="btn cbi-button cbi-button-negative" id="stop-monitor-btn" onclick="stopMonitoring()" disabled>Stop</button>
                        <span id="monitor-status" class="status-badge status-danger">Stopped</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label style="font-size: 12px; color: #999; margin: 0;">Refresh Rate:</label>
                        <select id="refresh-rate" class="cbi-input-select" style="width: 100px; font-size: 12px;">
                            <option value="1">1 second</option>
                            <option value="2">2 seconds</option>
                            <option value="5" selected>5 seconds</option>
                            <option value="10">10 seconds</option>
                            <option value="30">30 seconds</option>
                        </select>
                    </div>
                </div>

                <div class="cbi-value">
                    <div class="cbi-value-field">
                        <canvas id="signal-graph" class="signal-canvas" width="800" height="400"></canvas>
                    </div>
                </div>

                <div class="signal-stats">
                    <div class="signal-stat-item">
                        <div class="signal-stat-label">Current</div>
                        <div id="current-rssi" class="signal-stat-value">--</div>
                    </div>
                    <div class="signal-stat-item">
                        <div class="signal-stat-label">Average</div>
                        <div id="average-rssi" class="signal-stat-value">--</div>
                    </div>
                    <div class="signal-stat-item">
                        <div class="signal-stat-label">Min</div>
                        <div id="min-rssi" class="signal-stat-value">--</div>
                    </div>
                    <div class="signal-stat-item">
                        <div class="signal-stat-label">Max</div>
                        <div id="max-rssi" class="signal-stat-value">--</div>
                    </div>
                </div>
            </div>
        </fieldset>
    </div>
</div>

<script>
    let currentInterface = null;
    let selectedDevice = null;
    let monitorActive = false;
    let pollInterval = null;
    let rssiData = [];
    let maxDataPoints = 60; // Dynamic: 5 minutes worth of data
    let canvas = null;
    let ctx = null;

    function updateMaxDataPoints() {
        const refreshRate = parseInt(document.getElementById('refresh-rate').value);
        maxDataPoints = Math.floor(300 / refreshRate); // 300 seconds = 5 minutes
    }

    window.addEventListener('DOMContentLoaded', function() {
        canvas = document.getElementById('signal-graph');
        ctx = canvas.getContext('2d');
        loadInterfaces();

        // Update polling interval when refresh rate changes
        document.getElementById('refresh-rate').addEventListener('change', function() {
            updateMaxDataPoints();
            if (monitorActive) {
                startPolling();
            }
        });
    });

    function loadInterfaces() {
        fetch('<%=url("admin/network/taixintools/get_interfaces")%>')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('interface-select');
                select.innerHTML = '';

                data.interfaces.forEach(iface => {
                    const option = document.createElement('option');
                    option.value = iface;
                    option.textContent = iface;
                    select.appendChild(option);
                });

                if (data.default_interface) {
                    select.value = data.default_interface;
                    currentInterface = data.default_interface;
                    updateInterfaceStatus(data.has_hg0);
                    // Auto-scan if hg0 detected
                    if (data.has_hg0) {
                        setTimeout(() => autoScanAndStart(), 500);
                    }
                } else if (data.interfaces.length > 0) {
                    currentInterface = data.interfaces[0];
                    select.value = currentInterface;
                    updateInterfaceStatus(false);
                }

                select.addEventListener('change', function() {
                    currentInterface = this.value;
                    updateInterfaceStatus(this.value === 'hg0');
                    clearDeviceList();
                });
            });
    }

    function updateInterfaceStatus(isHg0) {
        const status = document.getElementById('interface-status');
        status.className = 'status-badge ' + (isHg0 ? 'status-success' : 'status-warning');
        status.textContent = isHg0 ? 'hg0 detected' : 'Manual';
    }

    function clearDeviceList() {
        selectedDevice = null;
        document.getElementById('device-list').innerHTML = '<div class="no-devices">Click "Scan for Devices"</div>';
        document.getElementById('start-monitor-btn').disabled = true;
        document.getElementById('device-warning').style.display = 'block';
    }

    function autoScanAndStart() {
        scanDevices().then(() => {
            // Auto-start monitoring if device was found
            if (selectedDevice) {
                setTimeout(() => startMonitoring(), 1000);
            }
        });
    }

    function scanDevices() {
        if (!currentInterface) {
            alert('Please select an interface first');
            return Promise.reject();
        }

        const btn = document.getElementById('scan-btn');
        const status = document.getElementById('scan-status');
        btn.disabled = true;
        btn.textContent = 'Scanning...';

        const formData = new FormData();
        formData.append('interface', currentInterface);

        return fetch('<%=url("admin/network/taixintools/scan_devices")%>', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success && data.devices && data.devices.length > 0) {
                displayDevices(data.devices);
                status.textContent = 'Found ' + data.devices.length;
            } else {
                clearDeviceList();
                status.textContent = 'No devices found';
            }
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = 'Scan for Devices';
        });
    }

    function displayDevices(devices) {
        const deviceList = document.getElementById('device-list');
        deviceList.innerHTML = '';

        devices.forEach(mac => {
            const item = document.createElement('div');
            item.className = 'device-item';
            item.textContent = mac;
            item.onclick = function() { selectDevice(mac, item); };
            deviceList.appendChild(item);
        });

        if (devices.length > 0) {
            selectDevice(devices[0], deviceList.firstChild);
        }
    }

    function selectDevice(mac, element) {
        document.querySelectorAll('.device-item').forEach(item => {
            item.classList.remove('selected');
        });

        element.classList.add('selected');
        selectedDevice = mac;
        document.getElementById('start-monitor-btn').disabled = false;
        document.getElementById('device-warning').style.display = 'none';
    }

    function startMonitoring() {
        if (!selectedDevice || !currentInterface) {
            alert('Please scan and select a device first');
            return;
        }

        const btn = document.getElementById('start-monitor-btn');
        btn.disabled = true;

        monitorActive = true;
        rssiData = [];
        updateMonitorStatus(true);
        document.getElementById('stop-monitor-btn').disabled = false;

        startPolling();
    }

    function stopMonitoring() {
        const btn = document.getElementById('stop-monitor-btn');
        btn.disabled = true;

        monitorActive = false;
        updateMonitorStatus(false);
        stopPolling();
        document.getElementById('start-monitor-btn').disabled = false;
    }

    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);
        updateMaxDataPoints();
        const refreshRate = parseInt(document.getElementById('refresh-rate').value) * 1000;
        pollInterval = setInterval(fetchSignal, refreshRate);
        fetchSignal();
    }

    function stopPolling() {
        if (pollInterval) {
            clearInterval(pollInterval);
            pollInterval = null;
        }
    }

    function fetchSignal() {
        if (!monitorActive) return;

        const formData = new FormData();
        formData.append('interface', currentInterface);
        formData.append('device', selectedDevice);

        fetch('<%=url("admin/network/taixintools/get_signal")%>', {
            method: 'POST',
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.rssi !== null) {
                    addDataPoint(data.rssi);
                    drawGraph();
                    updateStats();
                }
            });
    }

    function addDataPoint(rssi) {
        rssiData.push({
            timestamp: Date.now(),
            value: rssi
        });

        // Keep only last maxDataPoints
        if (rssiData.length > maxDataPoints) {
            rssiData.shift();
        }
    }

    function drawGraph() {
        if (!ctx || rssiData.length === 0) return;

        const width = canvas.width;
        const height = canvas.height;
        const padding = 40;
        const graphWidth = width - padding * 2;
        const graphHeight = height - padding * 2;

        // Clear canvas
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, width, height);

        // Draw grid
        ctx.strokeStyle = '#3a3a3a';
        ctx.lineWidth = 1;

        // Horizontal grid lines
        for (let i = 0; i <= 4; i++) {
            const y = padding + (graphHeight / 4) * i;
            ctx.beginPath();
            ctx.moveTo(padding, y);
            ctx.lineTo(width - padding, y);
            ctx.stroke();
        }

        // Draw labels (inverted: 0 at top, -100 at bottom)
        ctx.fillStyle = '#999';
        ctx.font = '7px monospace';
        ctx.textAlign = 'right';

        const rssiRange = [0, -25, -50, -75, -100];
        rssiRange.forEach((value, i) => {
            const y = padding + (graphHeight / 4) * i + 2;
            ctx.fillText(value + ' dBm', padding - 5, y);
        });

        // Draw signal line
        if (rssiData.length > 1) {
            ctx.strokeStyle = '#5cb85c';
            ctx.lineWidth = 2;
            ctx.beginPath();

            rssiData.forEach((point, i) => {
                const x = padding + (graphWidth / (maxDataPoints - 1)) * i;
                // Map RSSI (0 to -100) to graph height - INVERTED so 0 is at top
                const normalizedValue = Math.max(-100, Math.min(0, point.value));
                const y = padding + ((Math.abs(normalizedValue)) / 100 * graphHeight);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });

            ctx.stroke();

            // Draw points
            rssiData.forEach((point, i) => {
                const x = padding + (graphWidth / (maxDataPoints - 1)) * i;
                const normalizedValue = Math.max(-100, Math.min(0, point.value));
                const y = padding + ((Math.abs(normalizedValue)) / 100 * graphHeight);

                ctx.fillStyle = getSignalColor(point.value);
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
        }
    }

    function getSignalColor(rssi) {
        if (rssi >= -50) return '#5cb85c'; // Good
        if (rssi >= -70) return '#f0ad4e'; // Fair
        return '#d9534f'; // Poor
    }

    function updateStats() {
        if (rssiData.length === 0) return;

        const values = rssiData.map(d => d.value);
        const current = values[values.length - 1];
        const average = Math.round(values.reduce((a, b) => a + b, 0) / values.length);
        const min = Math.min(...values);
        const max = Math.max(...values);

        document.getElementById('current-rssi').textContent = current + ' dBm';
        document.getElementById('current-rssi').className = 'signal-stat-value ' + getSignalQuality(current);

        document.getElementById('average-rssi').textContent = average + ' dBm';
        document.getElementById('average-rssi').className = 'signal-stat-value ' + getSignalQuality(average);

        document.getElementById('min-rssi').textContent = min + ' dBm';
        document.getElementById('min-rssi').className = 'signal-stat-value ' + getSignalQuality(min);

        document.getElementById('max-rssi').textContent = max + ' dBm';
        document.getElementById('max-rssi').className = 'signal-stat-value ' + getSignalQuality(max);
    }

    function getSignalQuality(rssi) {
        if (rssi >= -50) return 'good';
        if (rssi >= -70) return 'fair';
        return 'poor';
    }

    function updateMonitorStatus(active) {
        const status = document.getElementById('monitor-status');
        const canvas = document.getElementById('signal-graph');

        if (active) {
            status.className = 'status-badge status-success';
            status.textContent = 'Running';
            canvas.classList.add('active');
        } else {
            status.className = 'status-badge status-danger';
            status.textContent = 'Stopped';
            canvas.classList.remove('active');
        }
    }

    window.addEventListener('beforeunload', function() {
        if (monitorActive) stopPolling();
    });
</script>

<%+footer%>
